name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild \
            -project Coloring.xcodeproj \
            -scheme Coloring \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4)' \
            CODE_SIGNING_ALLOWED=NO \
            clean test
