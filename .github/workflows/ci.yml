name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list devices available
          xcodebuild -project Coloring.xcodeproj -scheme Coloring -showdestinations

      - name: Build
        run: |
          xcodebuild \
            -project Coloring.xcodeproj \
            -scheme Coloring \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Test
        run: |
          xcodebuild \
            -project Coloring.xcodeproj \
            -scheme Coloring \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=26.2' \
            CODE_SIGNING_ALLOWED=NO \
            test
