name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'LICENSE'
      - 'LICENSE.*'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      IOS_SIMULATOR_VERSION: '26.5'
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      RESULT_BUNDLE: ${{ github.workspace }}/TestResults/Coloring.xcresult
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Coloring.xcodeproj

      - name: Show environment
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes
          xcodebuild -project Coloring.xcodeproj -scheme Coloring -showdestinations

      - name: Prepare simulator
        id: simulator
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(python3 <<'PY'
          import json
          import os
          import subprocess

          runtimes = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"])
          )["runtimes"]
          ios_runtimes = [
              runtime for runtime in runtimes
              if runtime.get("platform") == "iOS" and runtime.get("isAvailable")
              and runtime.get("version") == os.environ["IOS_SIMULATOR_VERSION"]
          ]
          if not ios_runtimes:
              raise SystemExit("Required iOS 26.5 simulator runtime is unavailable.")

          def version_key(runtime):
              parts = []
              for part in runtime.get("version", "0").split("."):
                  try:
                      parts.append(int(part))
                  except ValueError:
                      break
              return tuple(parts)

          runtime_identifier = sorted(ios_runtimes, key=version_key)[-1]["identifier"]

          device_types = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "--json"])
          )["devicetypes"]
          ipad_types = [
              device_type for device_type in device_types
              if device_type.get("name", "").startswith("iPad")
          ]
          if not ipad_types:
              raise SystemExit("No iPad simulator device types.")

          preferred_names = [
              "iPad Pro 13-inch (M5)",
              "iPad Pro 13-inch (M4)",
              "iPad Air 13-inch (M4)",
              "iPad (A16)",
          ]
          selected_device = next(
              (
                  device_type for preferred_name in preferred_names
                  for device_type in ipad_types
                  if device_type.get("name") == preferred_name
              ),
              ipad_types[-1],
          )

          simulator_id = subprocess.check_output(
              [
                  "xcrun",
                  "simctl",
                  "create",
                  "CI iPad",
                  selected_device["identifier"],
                  runtime_identifier,
              ],
              text=True,
          ).strip()
          print(simulator_id)
          PY
          )"
          echo "id=${SIMULATOR_ID}" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "${SIMULATOR_ID}" || true
          xcrun simctl bootstatus "${SIMULATOR_ID}" -b

      - name: Build for testing
        run: bash scripts/ci.sh build '${{ steps.simulator.outputs.id }}'

      - name: Unit tests
        run: bash scripts/ci.sh unit '${{ steps.simulator.outputs.id }}'

      - name: UI tests
        run: bash scripts/ci.sh ui '${{ steps.simulator.outputs.id }}'

      - name: Upload xcodebuild artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-artifacts
          path: |
            ${{ env.RESULT_BUNDLE }}
            TestResults/**/*.xcresult
            ${{ env.DERIVED_DATA }}/Logs/Test
